name: Test CI Pipeline

# Trigger the pipeline on pushes or pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Use the latest Ubuntu virtual environment provided by GitHub
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code onto the runner
    - name: Check out repository code
      uses: actions/checkout@v4

    # Step 2: Set up the runtime environment (Node.js example)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Step 3: Install project dependencies
    - name: Install dependencies
      run: npm ci

    # Step 4: Run your test suite
    - name: Run automated tests
      run: npm test
